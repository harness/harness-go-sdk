        properties:
            email:
                type: string
            userID:
                type: string
            username:
                type: string
        type: object
    internal_api.VariablesResponse:
        properties:
            inputs:
                items:
                    $ref: '#/definitions/template.Input'
                type: array
            loadTestIdentity:
                type: string
            variables:
                items:
                    $ref: '#/definitions/template.Variable'
                type: array
        type: object
    internal_api.WorkerStatResponse:
        properties:
            cpuCores:
                description: |-
                    CPUCores is averaged over the interval between the two most recent samples,
                    so a pod's first sample reports zero.
                type: number
            cpuLimitCores:
                type: number
            cpuRequestCores:
                description: |-
                    Requests and limits come from the pod spec, so they are present even when
                    usage could not be read.
                type: number
            memoryBytes:
                description: MemoryBytes is the working set, matching what kubectl top reports.
                type: integer
            memoryLimitBytes:
                type: integer
            memoryRequestBytes:
                type: integer
            name:
                type: string
            reason:
                description: |-
                    Reason explains the state in Kubernetes' own vocabulary, such as
                    "ContainerCreating" or "ImagePullBackOff", omitted when the state says it all.
                    Before a run starts every pod reads "pending", and only the reason separates a
                    routine image pull from a run that will never start.
                type: string
            state:
                type: string
            users:
                description: |-
                    Users is how many virtual users this pod is driving, omitted when the load
                    tool cannot report a per-pod count. These do not always sum to the run total:
                    k6 and Locust divide users between pods, JMeter replicates them onto each.
                type: integer
        type: object
