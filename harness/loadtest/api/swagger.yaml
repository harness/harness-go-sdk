                type: string
            serviceReferences:
                description: |-
                    ServiceReferences replaces the linked chaos services when non-nil.
                    Omit/null to keep existing; a non-nil slice must be non-empty.
                items:
                    type: string
                type: array
            skipScriptValidation:
                description: |-
                    SkipScriptValidation saves the script without static validation, for this
                    request only. The script size limit, the script-body expression check and
                    the ZIP workspace safety checks still apply.
                type: boolean
            tags:
                items:
                    type: string
                type: array
