            infraType:
                type: string
            name:
                type: string
            revision:
                type: string
            scriptContent:
                description: Base64-encoded script (required when scriptSource=inline)
                type: string
            scriptSource:
                description: '"inline" (default) or "image"'
                type: string
            skipScriptValidation:
                description: |-
                    SkipScriptValidation saves the script without static validation, for this
                    request only. The script size limit, the script-body expression check and
                    the ZIP workspace safety checks still apply.
                type: boolean
            tags:
                items:
                    type: string
                type: array
            toolConfig:
                additionalProperties: true
                type: object
            toolType:
                $ref: '#/definitions/internal_api.LoadTestToolType'
            variables:
                items:
                    $ref: '#/definitions/template.Variable'
                type: array
            yaml:
                description: |-
                    YAML is an optional base64-encoded canonical template YAML. When
                    supplied, the server parses it and folds the parsed fields into
                    the request as fallbacks (explicit JSON fields win on conflict).
                    The decoded YAML is also persisted verbatim on the document so the
                    caller-supplied form round-trips through GET unchanged. Omit to let
