definitions:
    Load-manager-cli_internal_domain.CleanupPolicy:
        enum:
            - delete
            - retain
        type: string
        x-enum-varnames:
            - CleanupPolicyDelete
            - CleanupPolicyRetain
    Load-manager-cli_internal_domain.ResourceList:
        additionalProperties:
            type: string
        type: object
    Load-manager-cli_internal_domain.ResourceRequirements:
        properties:
            limits:
                $ref: '#/definitions/Load-manager-cli_internal_domain.ResourceList'
            requests:
                $ref: '#/definitions/Load-manager-cli_internal_domain.ResourceList'
        type: object
    internal_api.AIFindingResponse:
        properties:
            evidence:
                description: Evidence is the number trail from the run's own metrics that backs the finding.
                type: string
            recommendation:
                description: Recommendation is the fix for this risk, so a reader never has to work out which advice addresses which problem. Present on critical and warning findings.
                type: string
            risk:
                description: Risk is what this costs the reader if left alone.
                type: string
            severity:
                enum:
                    - critical
                    - warning
                    - info
                type: string
            title:
                description: Title is what happened, in one line, carrying the number that makes it matter.
                type: string
        type: object
    internal_api.AIInsightsResponse:
        properties:
            caveats:
                items:
                    type: string
                type: array
            error:
                description: Error explains a Failed or Skipped status in the reader's language.
                type: string
            findings:
                items:
                    $ref: '#/definitions/internal_api.AIFindingResponse'
                type: array
            generatedAt:
                type: string
            headline:
                type: string
            model:
                type: string
            recommendations:
                items:
                    type: string
                type: array
            status:
                enum:
                    - Pending
                    - Generating
                    - Ready
                    - Failed
                    - Skipped
                type: string
            summary:
                type: string
        type: object
    internal_api.CheckStatResponse:
        properties:
            fails:
                type: integer
            name:
                type: string
            passes:
                type: integer
        type: object
    internal_api.CompositeLoadTest:
        properties:
            description:
                type: string
            identifier:
                type: string
            loadTest:
                $ref: '#/definitions/internal_api.CompositeLoadTestLoadTestSelection'
            name:
                type: string
            pipelineIdentifier:
                type: string
            probe:
                $ref: '#/definitions/internal_api.CompositeLoadTestProbeSelection'
            tags:
                additionalProperties:
                    type: string
                type: object
        type: object
    internal_api.CompositeLoadTestLoadTestSelection:
        properties:
            loadTestRef:
                description: LoadTestRef is the identity of the load test entity in the current scope.
                type: string
        required:
            - loadTestRef
        type: object
    internal_api.CompositeLoadTestProbeSelection:
        properties:
            duration:
                description: Duration is the probe run duration (e.g. "10m"); defaults when empty.
                type: string
            identity:
                description: Identity is the probe identity/reference.
                type: string
            infraReference:
                description: |-
                    InfraReference is optional; when empty the generated ChaosProbe step uses
                    a runtime input (<+input>) for Pipeline Studio.
                type: string
        required:
            - identity
        type: object
    internal_api.CreateCompositeLoadTestRequest:
        properties:
            description:
                type: string
            identifier:
                type: string
            loadTest:
                $ref: '#/definitions/internal_api.CompositeLoadTestLoadTestSelection'
            name:
                type: string
            probe:
                $ref: '#/definitions/internal_api.CompositeLoadTestProbeSelection'
            tags:
                additionalProperties:
                    type: string
                type: object
        required:
            - identifier
            - loadTest
            - name
            - probe
        type: object
    internal_api.CreateCompositeLoadTestResponse:
        properties:
            identifier:
                type: string
            name:
                type: string
            pipelineIdentifier:
                type: string
            stageIdentifier:
                type: string
        type: object
    internal_api.CreateLoadTestFromTemplateRequest:
        properties:
            description:
                type: string
            environmentIdentifier:
                type: string
            identity:
                type: string
            importType:
                type: string
            infraIdentifier:
                description: |-
                    InfraIdentifier + EnvironmentIdentifier are the concrete IDs the
                    resulting LoadTest will dispatch to. Required at the top level —
                    templates can carry `infraId: <+input>` and `envId: <+input>`
                    as runtime-input sentinels, but a LoadTest always needs concrete
                    values for both.
                type: string
            name:
                type: string
            serviceReferences:
                description: |-
                    ServiceReferences links the resulting load test to one or more chaos
                    services (chaosService identity strings). When the
                    CHAOS_RT_SERVICES_ENABLED feature flag is on, at least one link is
                    mandatory (services are the licensed unit); when off, the field is
                    ignored and stored empty. Templates do not carry service references, so
                    there is no inheritance: the value must be supplied directly on this
                    request (or via metadata.serviceReferences in the YAML body).
                items:
                    type: string
                type: array
            skipScriptValidation:
                description: |-
                    SkipScriptValidation saves the script without static validation, for this
                    request only. The script size limit, the script-body expression check and
                    the ZIP workspace safety checks still apply.
                type: boolean
            targetType:
                type: string
            templateReference:
                $ref: '#/definitions/internal_api.FromTemplateReferenceRequest'
            toolConfig:
                additionalProperties: true
                type: object
            variables:
                items:
                    $ref: '#/definitions/template.Variable'
                type: array
            yaml:
                type: string
        required:
            - environmentIdentifier
            - identity
            - importType
            - infraIdentifier
            - name
            - templateReference
        type: object
    internal_api.CreateLoadTestRequest:
        properties:
            cleanupPolicy:
                $ref: '#/definitions/Load-manager-cli_internal_domain.CleanupPolicy'
            description:
                type: string
            environmentIdentifier:
                type: string
            identity:
                type: string
            infraIdentifier:
                description: |-
                    InfraIdentifier and EnvironmentIdentifier name the user's own infrastructure. Required unless
                    ManagedInfra is set, in which case Harness provides the infrastructure and naming one is an
                    error rather than a preference — see Validate.
                type: string
            infraType:
                type: string
            isAIUsed:
                type: boolean
            managedInfra:
                description: |-
                    ManagedInfra asks Harness to provide the infrastructure for every run of this load test, rather
                    than running on infrastructure the user has already connected. Kubernetes only.
                type: boolean
            maxDurationSec:
                description: |-
                    MaxDurationSec is a per-LT hard cap on any run. It's an operator
                    guardrail, not a user-tunable, so it stays as a typed field rather
                    than living inside inputs.
                type: integer
            name:
                type: string
            resources:
                $ref: '#/definitions/Load-manager-cli_internal_domain.ResourceRequirements'
            scriptContent:
                description: Base64 encoded script (required when scriptSource=inline)
                type: string
            scriptSource:
                description: '"inline" (default) or "image"'
                type: string
            serviceReferences:
                description: |-
                    ServiceReferences links the load test to one or more chaos services
                    (chaosService identity strings). When the CHAOS_RT_SERVICES_ENABLED
                    feature flag is on, at least one is required; when off, the field is
                    ignored and stored empty.
                items:
                    type: string
                type: array
            skipScriptValidation:
                description: |-
                    SkipScriptValidation saves the script without static validation, for this
                    request only. The script size limit, the script-body expression check and
                    the ZIP workspace safety checks still apply.
                type: boolean
            tags:
                items:
                    type: string
                type: array
            targetType:
                description: Target infrastructure (linux or kubernetes)
                type: string
            toolConfig:
                additionalProperties: true
                description: |-
                    ToolConfig carries tool-specific structured configuration. For
                    toolType=K6 it holds the k6 spec (mode, uiDefinition, customImage,
                    options, hostUrl, iterations, metricTags, thresholds); validated via
                    domain.ParseK6ToolConfig; for toolType=Locust it holds the locust spec (mode, scriptContent, customImage, envVars, thresholds) under a `locust` key, validated via domain.ParseLocustToolConfig. Thresholds use the same shape for JMeter, Locust, and k6: metric, stat, operator, value, abortOnFail.
