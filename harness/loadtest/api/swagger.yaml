# Trimmed from the Load Test Manager swagger by harness/loadtest/scripts/copy_swagger.go.
# basePath is / because the source paths already start with /v1. Swagger codegen joins basePath and the path.
# The gateway prefix /loadTest/manager/api is not part of this spec. The provider adds it.
# ApiKeyAuth is the X-API-Key header the chaos auth middleware accepts. The source spec documents the UI bearer token.
swagger: "2.0"
info:
    contact:
        email: support@example.com
        name: API Support
    description: |-
        RESTful API for managing distributed load tests with Locust integration.

        ## Key Features
        - **Automated Load Test Orchestration**: Create and manage load tests programmatically
        - **Script Versioning**: Full revision history with rollback capability
        - **Real-time Metrics**: Collect metrics every 10 seconds during test execution
        - **Distributed Testing**: Support for remote VM and multi-cluster execution
        - **Automatic Plugin Injection**: Seamless Locust integration without script modification

        ## Authentication
        - **User-facing endpoints**: Bearer token authentication via Authorization header
        - **Internal callbacks**: X-Locust-Token header for Locust integration
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
    title: Load Test Management Platform API
    version: 1.0.0
basePath: /
schemes:
    - https
    - http
consumes:
    - application/json
produces:
    - application/json
securityDefinitions:
    ApiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key
        description: Harness API key. Load Test Manager accepts the chaos auth middleware header.
security:
    - ApiKeyAuth: []
paths:
    /v1/composite-load-tests:
        post:
            consumes:
                - application/json
            description: Creates a pipeline containing a single CompositeLoadTest stage that runs the selected load test and chaos probe in parallel.
            operationId: createCompositeLoadTest
            parameters:
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Composite load test definition
                  in: body
                  name: request
                  required: true
                  schema:
                    $ref: '#/definitions/internal_api.CreateCompositeLoadTestRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: Composite load test created successfully
                    schema:
                        $ref: '#/definitions/internal_api.CreateCompositeLoadTestResponse'
                "400":
                    description: Invalid request body or query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to create composite load test
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Create a composite load test
            tags:
                - CompositeLoadTests
    /v1/composite-load-tests/{identifier}:
        delete:
            description: Deletes the pipeline created for this stage id. The load test and the probe are left in place.
            operationId: deleteCompositeLoadTest
            parameters:
                - description: Stage identifier
                  in: path
                  name: identifier
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Composite load test deleted
                    schema:
                        $ref: '#/definitions/internal_api.SuccessResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Composite load test not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to delete composite load test
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Delete a composite load test
            tags:
                - CompositeLoadTests
        get:
            description: Reads the pipeline created for this stage id and returns the load test and probe stored in it. A runtime-input infrastructure reference and the default probe timeout are returned empty.
            operationId: getCompositeLoadTest
            parameters:
                - description: Stage identifier
                  in: path
                  name: identifier
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Composite load test
                    schema:
                        $ref: '#/definitions/internal_api.CompositeLoadTest'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Composite load test not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to get composite load test
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Get a composite load test
            tags:
                - CompositeLoadTests
        put:
            consumes:
                - application/json
            description: Rewrites the pipeline for this stage id. The load test must already exist in the same project.
            operationId: updateCompositeLoadTest
            parameters:
                - description: Stage identifier
                  in: path
                  name: identifier
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Composite load test definition
                  in: body
                  name: request
                  required: true
                  schema:
                    $ref: '#/definitions/internal_api.UpdateCompositeLoadTestRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: Composite load test updated
                    schema:
                        $ref: '#/definitions/internal_api.CompositeLoadTest'
                "400":
                    description: Invalid request
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Composite load test not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to update composite load test
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Update a composite load test
            tags:
                - CompositeLoadTests
    /v1/load-test-templates:
        post:
            consumes:
                - application/json
            description: Creates a new load test template with an initial revision. Supports base64-encoded script upload (scriptSource="inline") or container image reference (scriptSource="image"). When a script is provided, variables are auto-detected using hybrid env + tool-native argument parsing.
            operationId: createTemplate
            parameters:
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity where the template belongs
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
                - description: Template configuration
                  in: body
                  name: request
                  required: true
                  schema:
                    $ref: '#/definitions/internal_api.CreateLoadTestTemplateRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Template created successfully
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateResponse'
                "400":
                    description: Invalid request body or validation error, or the script failed validation (errorCode E2022)
                    schema:
                        $ref: '#/definitions/internal_api.ScriptValidationErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to create template
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Create a new load test template
            tags:
                - Templates
    /v1/load-test-templates/{identity}:
        delete:
            description: Soft-deletes all revisions of a template. Returns 409 Conflict if any active load tests reference this template — delete the associated load tests first.
            operationId: deleteTemplate
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Template deleted successfully
                    schema:
                        $ref: '#/definitions/internal_api.SuccessResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "409":
                    description: Cannot delete — load tests reference this template
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to delete template
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Delete a load test template
            tags:
                - Templates
        get:
            description: Retrieves the latest revision of a load test template by identity within a hub
            operationId: getTemplate
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Template details
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Get load test template
            tags:
                - Templates
        put:
            consumes:
                - application/json
            description: Updates mutable fields (name, description, variables, toolConfig, args, tags) of the latest revision of a template
            operationId: updateTemplate
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
                - description: Fields to update
                  in: body
                  name: request
                  required: true
                  schema:
                    $ref: '#/definitions/internal_api.UpdateLoadTestTemplateRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: Template updated successfully
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateResponse'
                "400":
                    description: Invalid request body or validation error, or the script failed validation (errorCode E2022)
                    schema:
                        $ref: '#/definitions/internal_api.ScriptValidationErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to update template
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Update a load test template
            tags:
                - Templates
    /v1/load-test-templates/{identity}/referenced-by:
        get:
            description: Returns a paginated list of entities that reference the given template. Today only load tests can reference a template (kind="LoadTest"); the list is account-wide because a REFERENCE load test can live in a different org / project than the template it pins.
            operationId: getTemplateReferencedBy
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
                - description: Page index (0-based)
                  in: query
                  name: page
                  type: integer
                - description: Page size
                  in: query
                  name: limit
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: Paginated list of referencing entities
                    schema:
                        $ref: '#/definitions/internal_api.TemplateReferencedByResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to list referencing entities
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: List entities referencing a load test template
            tags:
                - Templates
    /v1/load-test-templates/{identity}/revisions:
        post:
            consumes:
                - application/json
            description: Creates a new revision of an existing template. Fields not provided in the request are inherited from the latest revision. Each revision is stored as a separate MongoDB document.
            operationId: createTemplateRevision
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
                - description: New revision configuration
                  in: body
                  name: request
                  required: true
                  schema:
                    $ref: '#/definitions/internal_api.CreateTemplateRevisionRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Template revision created successfully
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateResponse'
                "400":
                    description: Invalid request body or validation error, or the script failed validation (errorCode E2022)
                    schema:
                        $ref: '#/definitions/internal_api.ScriptValidationErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to create revision
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Create a new template revision
            tags:
                - Templates
    /v1/load-test-templates/{identity}/revisions/{revision}:
        delete:
            description: Soft-deletes a specific revision of a template
            operationId: deleteTemplateRevision
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: Template revision to delete
                  in: path
                  name: revision
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Template revision deleted successfully
                    schema:
                        $ref: '#/definitions/internal_api.SuccessResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to delete template revision
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Delete a specific template revision
            tags:
                - Templates
        get:
            description: Retrieves a specific revision of a load test template
            operationId: getTemplateRevision
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: Template revision
                  in: path
                  name: revision
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Template revision details
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template revision not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Get a specific template revision
            tags:
                - Templates
    /v1/load-test-templates/{identity}/variables:
        get:
            description: Returns a template revision's variable definitions (custom script env vars) alongside the runtime inputs discovered in its toolConfig — every leaf left as the "<+input>" sentinel — each carrying the declared type so a client knows whether to prompt for a string, number, integer or boolean. This is the template-side counterpart of GET /v1/load-tests/{identity}/variables and returns the same two arrays, so a caller binding runtime values against a template revision (for example a pipeline step that references a template) does not have to read them out of the full template envelope. Omit the revision query parameter to resolve the template's latest revision.
            operationId: getTemplateVariables
            parameters:
                - description: Template identity
                  in: path
                  name: identity
                  required: true
                  type: string
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: Hub identity
                  in: query
                  name: hubIdentity
                  required: true
                  type: string
                - description: Template revision; defaults to the latest revision
                  in: query
                  name: revision
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Variables and runtime inputs for the template revision
                    schema:
                        $ref: '#/definitions/internal_api.LoadTestTemplateVariablesResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "404":
                    description: Template not found
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to resolve tool inputs
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: Get all variables for a load test template
            tags:
                - Templates
    /v1/load-tests:
        get:
            description: |-
                Returns a paginated list of all load test configurations with optional filtering and sorting.
                Items leave out the script: scriptContent, yaml and toolConfig's script.content. Get a load test by its identity for its script.
            operationId: listLoadTests
            parameters:
                - description: account id to access the resource
                  in: query
                  name: accountIdentifier
                  required: true
                  type: string
                - in: query
                  name: environmentIdentifier
                  type: string
                - default: 15
                  in: query
                  maximum: 100
                  minimum: 1
                  name: limit
                  type: integer
                - description: organization id to access the resource
                  in: query
                  name: organizationIdentifier
                  type: string
                - default: 0
                  in: query
                  name: page
                  type: integer
                - description: resolved parent scope unique ID (from scope-info API or query param)
                  in: query
                  name: parentUniqueId
                  type: string
                - description: project id to access the resource
                  in: query
                  name: projectIdentifier
                  type: string
                - description: name that you want to search
                  in: query
                  name: search
                  type: string
                - description: if sort order ascending or not
                  in: query
                  name: sortAscending
                  type: boolean
                - description: field  name that you want to sort
                  enum:
                    - name
                    - lastUpdated
                    - experimentName
                    - lastExecuted
                    - createdAt
                  in: query
                  name: sortField
                  type: string
                - collectionFormat: csv
                  in: query
                  items:
                    type: string
                  name: tags
                  type: array
                - enum:
                    - Locust
                    - JMeter
                    - K6
                  in: query
                  name: toolType
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Paginated list of load tests
                    schema:
                        $ref: '#/definitions/internal_api.PaginatedLoadTestListResponse'
                "400":
                    description: Invalid query parameters
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
                "500":
                    description: Failed to list load tests
                    schema:
                        $ref: '#/definitions/internal_api.ErrorResponse'
            security:
                - ApiKeyAuth: []
            summary: List all load tests
            tags:
                - LoadTests
        post:
            consumes:
